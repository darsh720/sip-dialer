<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIP Web Softphone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ff6b1a;
    --orange-dark: #e0570a;
    --ink: #1a1d21;
    --paper: #ffffff;
    --line: #e7e5e2;
    --muted: #6b7280;
    --ok: #1a8f5a;
    --ring: #d97706;
    --bad: #d33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f7f6f4;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .phone {
    width: 360px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 12px 32px rgba(20,20,20,0.06);
    overflow: hidden;
  }
  .bar {
    background: var(--ink);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .bar .brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .bar .brand span { color: var(--orange); }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #555;
    display: inline-block;
    margin-right: 6px;
  }
  .dot.live { background: var(--ok); }
  .dot.ring { background: var(--ring); }
  .dot.bad { background: var(--bad); }
  .status-row {
    font-size: 12px;
    color: #cfcfcf;
    display: flex;
    align-items: center;
  }

  .body { padding: 20px; }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fcfbfa;
  }
  .field input:focus {
    outline: none;
    border-color: var(--orange);
    background: white;
  }

  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    width: 100%;
    background: var(--orange);
    color: white;
    font-weight: 600;
    font-size: 14px;
    padding: 11px;
    border-radius: 8px;
    margin-top: 4px;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--orange-dark); }
  .btn-primary:disabled { background: #ddd; color: #999; cursor: not-allowed; }

  .btn-ghost {
    width: 100%;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    padding: 8px;
    border-radius: 8px;
    margin-top: 6px;
  }
  .btn-ghost:hover { background: #f2f1ef; }

  .divider {
    border-top: 1px solid var(--line);
    margin: 18px 0;
  }

  .call-panel { display: none; }
  .call-panel.active { display: block; }
  .reg-panel.hidden { display: none; }

  .remote {
    text-align: center;
    margin-bottom: 14px;
  }
  .remote .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .remote .who { font-size: 18px; font-weight: 600; margin-top: 4px; word-break: break-all; }
  .remote .state { font-size: 13px; color: var(--orange); margin-top: 4px; font-weight: 500; }

  .dialpad-input {
    width: 100%;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 14px;
    letter-spacing: 0.05em;
  }
  .dialpad-input:focus { outline: none; border-color: var(--orange); }

  .keys {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .key {
    background: #f7f6f4;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 0;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    transition: background 0.1s;
  }
  .key:hover { background: #efeeec; }
  .key:active { background: var(--orange); color: white; border-color: var(--orange); }

  .call-actions { display: flex; gap: 10px; }
  .btn-call {
    flex: 1;
    background: var(--ok);
    color: white;
    font-weight: 600;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  .btn-hangup {
    flex: 1;
    background: var(--bad);
    color: white;
    font-weight: 600;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  .btn-answer {
    flex: 1;
    background: var(--ok);
    color: white;
    font-weight: 600;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
  }

  .error-msg {
    font-size: 12px;
    color: var(--bad);
    margin-top: 8px;
    display: none;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="bar">
    <div class="brand">CNET<span>GEEK</span> Softphone (UDP)</div>
    <div class="status-row">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Not registered</span>
    </div>
  </div>

  <div class="body">

    <!-- Registration form -->
    <div class="reg-panel" id="regPanel">
      <div class="field">
        <label>Extension</label>
        <input type="text" id="extension" placeholder="1001" autocomplete="off">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="off">
      </div>
      <div class="row2">
        <div class="field">
          <label>Asterisk Server / IP</label>
          <input type="text" id="server" placeholder="192.168.1.10" autocomplete="off">
        </div>
        <div class="field" style="max-width:90px;">
          <label>Port</label>
          <input type="text" id="port" placeholder="5060" value="5060">
        </div>
      </div>
      <button class="btn-primary" id="registerBtn">Register</button>
      <div class="error-msg" id="regError"></div>
    </div>

    <!-- Registered / dialer view -->
    <div id="dialerPanel" style="display:none;">
      <div class="dialpad-input" id="numberDisplay">&nbsp;</div>

      <div class="keys" id="keys">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key" data-key="*">*</button>
        <button class="key" data-key="0">0</button>
        <button class="key" data-key="#">#</button>
      </div>

      <div id="idleActions">
        <div class="call-actions">
          <button class="btn-call" id="callBtn">Call</button>
        </div>
        <div class="error-msg" id="callError"></div>
      </div>

      <div id="activeCallActions" style="display:none;">
        <div class="remote">
          <div class="label">Call status</div>
          <div class="who" id="remoteUri">—</div>
          <div class="state" id="callState">Idle</div>
        </div>
        <div class="call-actions">
          <button class="btn-answer" id="answerBtn" style="display:none;">Answer</button>
          <button class="btn-hangup" id="hangupBtn">Hang up</button>
        </div>
      </div>

      <button class="btn-ghost" id="unregisterBtn">Unregister</button>
    </div>

  </div>
</div>

<script>
const el = (id) => document.getElementById(id);
let dialedNumber = "";

function setStatusDot(cls) {
  el('statusDot').className = 'dot ' + cls;
}

function applyState(state) {
  el('statusText').textContent = state.reg_status || 'Not registered';

  if (state.registered) {
    setStatusDot('live');
    el('regPanel').style.display = 'none';
    el('dialerPanel').style.display = 'block';
  } else {
    setStatusDot('bad');
    el('regPanel').style.display = 'block';
    el('dialerPanel').style.display = 'none';
  }

  const inCall = state.call_status && state.call_status !== 'Idle';
  if (inCall) {
    setStatusDot(state.call_status.toLowerCase().includes('ring') ? 'ring' : 'live');
    el('idleActions').style.display = 'none';
    el('activeCallActions').style.display = 'block';
    el('remoteUri').textContent = state.remote_uri || '—';
    el('callState').textContent = state.call_status;
    el('answerBtn').style.display = state.call_status.toLowerCase().includes('incoming') ? 'block' : 'none';
  } else {
    el('idleActions').style.display = 'block';
    el('activeCallActions').style.display = 'none';
  }
}

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  return res.json();
}

// --- Registration ---
el('registerBtn').addEventListener('click', async () => {
  const extension = el('extension').value.trim();
  const password = el('password').value;
  const server = el('server').value.trim();
  const port = parseInt(el('port').value || '5060', 10);
  const errBox = el('regError');
  errBox.style.display = 'none';

  if (!extension || !password || !server) {
    errBox.textContent = 'Please fill in extension, password, and server.';
    errBox.style.display = 'block';
    return;
  }

  el('registerBtn').disabled = true;
  el('registerBtn').textContent = 'Registering...';
  const result = await post('/api/register', { extension, password, server, port });
  el('registerBtn').disabled = false;
  el('registerBtn').textContent = 'Register';

  if (!result.ok) {
    errBox.textContent = result.error || 'Registration failed.';
    errBox.style.display = 'block';
  }
});

el('unregisterBtn').addEventListener('click', async () => {
  await post('/api/unregister');
});

// --- Dial pad ---
document.querySelectorAll('.key').forEach(btn => {
  btn.addEventListener('click', () => {
    const digit = btn.dataset.key;
    dialedNumber += digit;
    el('numberDisplay').textContent = dialedNumber;
    // If a call is active, send as DTMF instead of building a number
    post(`/api/dtmf/${encodeURIComponent(digit)}`);
  });
});

el('callBtn').addEventListener('click', async () => {
  const errBox = el('callError');
  errBox.style.display = 'none';
  if (!dialedNumber) {
    errBox.textContent = 'Enter a number before calling.';
    errBox.style.display = 'block';
    return;
  }
  el('callBtn').disabled = true;
  try {
    const result = await post('/api/dial', { number: dialedNumber });
    if (!result.ok) {
      errBox.textContent = result.error || 'Call could not be started.';
      errBox.style.display = 'block';
    }
  } catch (error) {
    errBox.textContent = 'The call request failed. Check that the server is running.';
    errBox.style.display = 'block';
  } finally {
    el('callBtn').disabled = false;
  }
});

el('answerBtn').addEventListener('click', async () => {
  await post('/api/answer');
});

el('hangupBtn').addEventListener('click', async () => {
  await post('/api/hangup');
  dialedNumber = "";
  el('numberDisplay').innerHTML = '&nbsp;';
});

// --- Live status via WebSocket ---
function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/status`);
  ws.onmessage = (evt) => applyState(JSON.parse(evt.data));
  ws.onclose = () => setTimeout(connectWs, 1500);
}
connectWs();

// Initial state fetch (in case WS takes a moment)
fetch('/api/status').then(r => r.json()).then(applyState);
</script>

</body>
</html>
